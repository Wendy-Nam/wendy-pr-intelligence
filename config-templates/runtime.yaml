schema_version: 1
timezone: Asia/Seoul
llm:
  backend: null
  strategy: single
  enrichment: off
  models: {synthesis: null, enrichment: null, glossary: null, pr: null}
  effort: low
  max_calls: 3
  max_parallel: 1
  job_timeout_seconds: 180
  run_timeout_seconds: 600
  max_input_bytes: 120000
  max_output_bytes: 1000000
  max_repairs: 1
validation: {min_extraction_ratio: 0.5, hold_on_partial_collection: true}
retention: {cache_days: 7, generated_days: 30, audit_days: 90, keep_delivery_ledger: true}
