name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      # Scope static checks to the delivery boundary while legacy modules migrate.
      - run: ruff check prmonitor/delivery.py prmonitor/delivery_providers.py prmonitor/email_service.py scripts/send-email.py tests/test_delivery_live_contract.py
      - run: ruff format --check prmonitor/delivery.py prmonitor/delivery_providers.py prmonitor/email_service.py scripts/send-email.py tests/test_delivery_live_contract.py
      # Includes allowlist/manifest validation and all three host bundle smoke tests.
      - run: python -m pytest tests -q -m 'not live'
